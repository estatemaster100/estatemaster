<!doctype html>
<html>
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <!-- <base href="\/"> -->

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="Estate Master" />

    <!--  Added mobile responsive viewport scale tag to fix tiny text and icons on mobile devices -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="#FF9800" />
    <meta name="apple-mobile-web-app-title" content="Estate Master" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.ico" />

    <title>ByoE</title>
    <link rel="manifest" href="manifest.json" />

    <!-- Minified CSS, layout spacing corrections, and hardware acceleration styling adjustments -->
    <style>
      body {
        background-color: #ffffff;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      .startup-loading-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 9999;
        background-color: #ffffff;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #f3f4f6;
        border-top: 4px solid #00ffff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      .loading-text {
        font-size: 15px;
        color: #1f2937;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <!--  Added target ID hook for clean layout removal -->
    <div id="loading-splash" class="startup-loading-container">
      <div class="spinner"></div>
      <div class="loading-text">Loading. please wait...</div>
    </div>

    <script>
      window.addEventListener("beforeinstallprompt", function (e) {
        window.__pwaInstallPrompt = e;
      });

      //  High-Performance Cleanup Hook: Listens for the absolute earliest frame initialization signal
      window.addEventListener("flutter-first-frame", function () {
        var splash = document.getElementById("loading-splash");
        if (splash) {
          splash.remove();
        }
      });
    </script>
    <!-- Keep async active to let your loading screen mount instantly without blockages -->
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
